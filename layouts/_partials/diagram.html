{{- /* Abstract inline SVG schemes. Context: name ("stack" | "tapreply" | "terroir") */ -}}
{{- $n := . -}}
{{- if eq $n "stack" -}}
<svg class="diagram" viewBox="0 0 420 300" role="img" aria-labelledby="dg-stack-t">
  <title id="dg-stack-t">{{ T "dgStack" }}</title>
  <path class="d-line" d="M110 78 V128 H210 V150"/>
  <path class="d-line" d="M310 78 V128 H210"/>
  <path class="d-flow" d="M210 196 V226"/>
  <path class="d-line" d="M210 226 H95 V236"/>
  <path class="d-line" d="M210 226 H325 V236"/>
  <path class="d-flow" d="M110 78 V128 H210 V150"/>
  <rect class="d-box" x="40" y="30" width="140" height="48" rx="10"/>
  <text class="d-label" x="60" y="52">Mobile app</text><text class="d-sub" x="60" y="67">FLUTTER · iOS/ANDROID</text>
  <rect class="d-box" x="240" y="30" width="140" height="48" rx="10"/>
  <text class="d-label" x="260" y="52">Web / PWA</text><text class="d-sub" x="260" y="67">BROWSER</text>
  <rect class="d-box-accent" x="140" y="150" width="140" height="46" rx="10"/>

  <rect class="d-box" x="30" y="236" width="130" height="46" rx="10"/>

  <rect class="d-box" x="260" y="236" width="130" height="46" rx="10"/>
  <text class="d-label" x="278" y="257">Integrations</text><text class="d-sub" x="278" y="272">3RD-PARTY · AI</text>
  <circle class="d-dot" cx="210" cy="128" r="3"/><circle class="d-dot" cx="210" cy="226" r="3"/>
</svg>
{{- else if eq $n "tapreply" -}}
<svg class="diagram" viewBox="0 0 420 300" role="img" aria-labelledby="dg-tr-t">

  <path class="d-line" d="M100 150 H170"/>
  <path class="d-line" d="M100 240 H150 V170 H170"/>

  <rect class="d-box" x="10" y="218" width="90" height="44" rx="10"/><text class="d-label" x="24" y="238">Platform …</text><text class="d-sub" x="24" y="252">ADAPTER</text>
  <rect class="d-box-accent" x="170" y="106" width="120" height="88" rx="14"/>
  <text class="d-label" x="190" y="140">Core</text><text class="d-sub" x="190" y="158">DRAFTS · TONE</text><text class="d-sub" x="190" y="172">LANGUAGE</text>

{{- else if eq $n "terroir" -}}
<svg class="diagram" viewBox="0 0 420 300" role="img" aria-labelledby="dg-te-t">
  <title id="dg-te-t">{{ T "dgTerroir" }}</title>
  <path class="d-line" d="M210 72 L210 118"/>
  <path class="d-line" d="M120 236 L172 178"/>
  <path class="d-line" d="M300 236 L248 178"/>
  <path class="d-flow" d="M110 228 Q210 120 310 228"/>

</svg>
